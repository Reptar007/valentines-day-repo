<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentines Letter</title>
</head>
<body>
    <!-- Envelope Screen -->
     <div id="envelope-container">
        <img src="envelope.png" alt="Envelope" id="envelope" />
        <p>♡ Letter For My Bubz ♡</p>
     </div>

     <!-- Letter Screen -->
      <div id="letter-container">
        <div class="letter-window">
            <h1 id="letter-title"> Will you be my Valentine?</h1>
            <img src="cat_dance.gif" class="cat" alt="letter-cat" id="letter-cat" />

            <div class="buttons" id="letter-buttons">
                <img src="yes.png" class="btn yes-btn" alt="Yes" />

                <div class="no-wrapper">
                    <img src="no.png" class="btn no-btn" alt="No" />
                </div>
            </div>

            <p class="final-text" id="final-test" style="display: none;"></p>
        </div>
      </div>
    <script src="script.js"></script>
</body>
</html>
